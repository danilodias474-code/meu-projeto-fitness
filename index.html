<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meu Projeto Fitness 2026</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14130f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fitness 2026">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#14130f;--card:#1f1d17;--line:#35322a;--tx:#f5f2e8;--mut:#a8a392;--y:#ffd21f;--ok:#3ddc84}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.35}
main{padding:calc(env(safe-area-inset-top) + 18px) 16px calc(96px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
h1{font-size:28px;margin:0 0 4px;font-weight:900;letter-spacing:-.5px}
h2{font-size:20px;margin:22px 0 10px;font-weight:800}
.sub{color:var(--mut);margin:0 0 16px;text-transform:capitalize}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.hero{background:var(--y);color:#14130f;border:0}
.hero .sub{color:#14130f;opacity:.75;margin:0}
.bar{height:10px;background:#14130f33;border-radius:9px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:#14130f;border-radius:9px;transition:width .3s}
.ex{display:flex;gap:12px;align-items:center}
.ex.done{border-color:var(--ok)}
.ex.done .nm{text-decoration:line-through;opacity:.6}
.chk{flex:none;width:56px;height:56px;border-radius:50%;border:3px solid var(--y);background:none;color:var(--bg);font-size:28px;font-weight:900}
.done .chk{background:var(--ok);border-color:var(--ok)}
.nm{font-weight:800;font-size:18px}
.sr{color:var(--y);font-weight:700}
.meta{display:flex;gap:10px;align-items:center;margin-top:6px;font-size:14px;color:var(--mut)}
.meta input{width:76px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:16px}
.meta a{color:var(--mut)}
.btn{display:block;width:100%;min-height:60px;border:0;border-radius:16px;background:var(--y);color:#14130f;font-size:19px;font-weight:900;margin-top:6px}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--line);min-height:48px;font-size:16px}
.btn.ok{background:var(--ok)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0e0d0a;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:9}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0 8px;font-size:11.5px;font-weight:700;min-height:62px}
nav button b{display:block;font-size:22px;line-height:1.1}
nav button.on{color:var(--y)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:12px;font-weight:700;font-size:15px}
.cal .h{aspect-ratio:auto;color:var(--mut);font-size:13px}
.cal .pl{background:var(--card);border:1px dashed var(--mut)}
.cal .fn{background:var(--ok);color:#06210f;border:0}
.cal .td{outline:2px solid var(--y)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;gap:8px}.chips .card{flex:1;text-align:center;margin:0}.chips b{font-size:28px;color:var(--y);display:block}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px}
.bars div{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.bars i{display:block;background:var(--y);border-radius:6px 6px 0 0;min-height:3px;margin-bottom:4px}
.in{display:flex;gap:8px}.in input{flex:1;min-width:0;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:17px}
.in button{width:100px;margin:0;min-height:50px}
.sm{background:none;border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:8px 12px;font-size:14px}
ul{list-style:none;margin:8px 0 0;padding:0;color:var(--mut);font-size:15px}
</style></head><body>
<main id="v"></main>
<nav id="nav"></nav>
<script>
const W={
A:{n:"Inferiores + cárdio moderado",s:"Foco em quadríceps",e:[["Agachamento sumô","5x 20/15/12/10"],["Afundo no smith","4x10 cada lado"],["Elevação pélvica","3x10"],["Stiff com barra","4x12 · movimento controlado"],["Coice na polia","3x8 cada lado"],["Cárdio moderado","30 min · bike ou esteira",1]]},
B:{n:"Superiores + cárdio",s:"Prioridade em superiores",e:[["Remada máquina","4x12 · pico de contração"],["Supino máquina","3x12"],["Desenvolvimento livre","4x10 · movimento controlado"],["Rosca direta na polia","4x10"],["Tríceps corda","3x20"],["HIIT na esteira","20 min (ou cárdio direto 30 min)",1]]},
C:{n:"Inferiores · prioridade",s:"Quadríceps e posterior",e:[["Cadeira extensora","3x20 com dropset"],["Agachamento smith","4x 15/12/10 · pirâmide"],["Leg press unilateral","3x10 cada lado"],["Cadeira flexora","4x12 · pico de contração"],["Stiff","3x12 · movimento controlado"],["Cadeira abdutora","3x15 · pico de contração"]]},
D:{n:"Inferiores completo",s:"Glúteos e pernas",e:[["Afundo no smith","4x10 · progredir carga"],["Agachamento búlgaro","3x12 · movimento controlado"],["Terra sumô","4x8 · progredir carga"],["Coice + abdução na polia","3x12 em ambos"],["Cadeira abdutora","3x20 com dropset"],["Elevação pélvica","4x10 · progredir carga"]]}};
const P={1:"A",2:"B",3:"C",4:"B",6:"D"},DN=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dt=s=>new Date(s+"T12:00"),today=()=>ymd(new Date());
let S;try{S=JSON.parse(localStorage.getItem("mpf26"))}catch(e){}S=S||{log:{},w:[]};
const save=()=>{try{localStorage.setItem("mpf26",JSON.stringify(S))}catch(e){}};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const keyFor=d=>(S.log[d]&&S.log[d].w)||P[dt(d).getDay()];
const lg=d=>S.log[d]=S.log[d]||{ex:{}};
const fmt=(s,o)=>dt(s).toLocaleDateString("pt-BR",o);
let tab="home",cm=new Date();cm.setDate(1);
const T=[["home","🏠","Início"],["treinos","🏋️","Treinos"],["cal","📅","Calendário"],["evo","📈","Evolução"],["hist","🕘","Histórico"]];
function nav(){$("#nav").innerHTML=T.map(t=>`<button class="${tab==t[0]?"on":""}" data-a="tab" data-v="${t[0]}"><b>${t[1]}</b>${t[2]}</button>`).join("")}
const $=s=>document.querySelector(s);
function exCard(w,l,i){const e=w.e[i],x=(l.ex||{})[i]||{};
return `<div class="card ex ${x.d?"done":""}"><button class="chk" data-a="tog" data-i="${i}" aria-label="Concluir exercício">${x.d?"✓":""}</button><div style="flex:1;min-width:0"><div class="nm">${e[0]}</div><div class="sr">${e[1]}</div>
<div class="meta">${e[2]?"":`<input type="number" inputmode="decimal" placeholder="kg" value="${x.kg||""}" data-a="kg" data-i="${i}">`}<a href="https://www.youtube.com/results?search_query=${encodeURIComponent(e[0]+" execução")}" target="_blank" rel="noopener">▶ Ver execução</a></div></div></div>`}
function home(){const d=today(),k=keyFor(d),l=S.log[d]||{};
if(!k){let n=1;for(let j=1;j<=7;j++){const wd=(new Date().getDay()+j)%7;if(P[wd]){n=j;var nx=wd;break}}
return `<h1>Dia de descanso 😴</h1><p class="sub">${fmt(d,{weekday:"long",day:"numeric",month:"long"})}</p><div class="card">Recuperar também é treinar. Próximo treino: <b>${DN[nx]}</b> — ${W[P[nx]].n}.</div><button class="btn alt" data-a="tab" data-v="treinos">Treinar mesmo assim</button>`}
const w=W[k],n=w.e.filter((_,i)=>(l.ex||{})[i]&&l.ex[i].d).length,p=Math.round(n/w.e.length*100);
return `<p class="sub">${fmt(d,{weekday:"long",day:"numeric",month:"long"})}</p><div class="card hero"><h1>${w.n}</h1><p class="sub">${w.s}</p><div class="bar"><i style="width:${p}%"></i></div><p class="sub" style="margin-top:8px"><b>${n} de ${w.e.length}</b> exercícios${l.fin?" · treino concluído ✓":""}</p></div>`
+w.e.map((_,i)=>exCard(w,l,i)).join("")+(l.fin?`<button class="btn alt" data-a="unfin">Reabrir treino</button>`:`<button class="btn ok" data-a="fin">✓ Concluir treino</button>`)}
function treinos(){return `<h1>Treinos</h1><p class="sub">Sua semana: seg, ter, qua, qui e sáb</p>`+[1,2,3,4,6].map(wd=>{const k=P[wd],w=W[k];return `<div class="card"><div class="row"><b style="font-size:19px">${DN[wd]}</b><span class="sr">${w.s}</span></div><div style="margin:2px 0">${w.n}</div><ul>${w.e.map(e=>`<li>${e[0]} — ${e[1]}</li>`).join("")}</ul><button class="btn alt" style="margin-top:12px" data-a="pick" data-v="${k}">Fazer este treino hoje</button></div>`}).join("")}
function cal(){const y=cm.getFullYear(),m=cm.getMonth(),f=new Date(y,m,1).getDay(),nd=new Date(y,m+1,0).getDate();
let c=["D","S","T","Q","Q","S","S"].map(x=>`<div class="h">${x}</div>`).join("")+"<div></div>".repeat(f);
for(let i=1;i<=nd;i++){const d=ymd(new Date(y,m,i)),cl=(S.log[d]&&S.log[d].fin?"fn":P[new Date(y,m,i).getDay()]?"pl":"")+(d==today()?" td":"");c+=`<div class="${cl}">${i}</div>`}
return `<div class="row"><button class="sm" data-a="mm" data-v="-1">‹</button><h1 style="text-transform:capitalize;font-size:22px;margin:0">${cm.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}</h1><button class="sm" data-a="mm" data-v="1">›</button></div><div class="cal" style="margin-top:16px">${c}</div><p class="sub" style="margin-top:16px;text-transform:none">🟩 concluído &nbsp; ▫️ treino previsto</p>`}
const fins=()=>Object.keys(S.log).filter(d=>S.log[d].fin).sort();
function evo(){const f=fins(),now=new Date(),mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));
const wk=[];for(let i=5;i>=0;i--){const a=new Date(mon);a.setDate(mon.getDate()-7*i);const b=new Date(a);b.setDate(a.getDate()+6);const A=ymd(a),B=ymd(b);wk.push([a.getDate()+"/"+(a.getMonth()+1),f.filter(d=>d>=A&&d<=B).length])}
const mo=f.filter(d=>d.slice(0,7)==today().slice(0,7)).length,ld={};
f.forEach(d=>{const w=W[keyFor(d)];Object.entries(S.log[d].ex||{}).forEach(([i,x])=>{if(x.kg&&w.e[i])(ld[w.e[i][0]]=ld[w.e[i][0]]||[]).push(+x.kg)})});
const ws=S.w.slice(-12),mx=Math.max(...ws.map(x=>x.kg),1),mn=Math.min(...ws.map(x=>x.kg),mx);
const pts=ws.length>1?ws.map((x,i)=>`${i*(280/(ws.length-1))},${55-(x.kg-mn)/((mx-mn)||1)*50}`).join(" "):"";
return `<h1>Evolução</h1><div class="chips" style="margin-top:12px"><div class="card"><b>${f.length}</b>treinos</div><div class="card"><b>${mo}</b>no mês</div></div>
<h2>Treinos por semana</h2><div class="card bars">${wk.map(x=>`<div><i style="height:${x[1]*18}px"></i>${x[1]}<br>${x[0]}</div>`).join("")}</div>
<h2>Peso corporal</h2><div class="card"><div class="in"><input id="wt" type="number" inputmode="decimal" placeholder="kg hoje"><button class="btn" data-a="wt">Salvar</button></div>${pts?`<svg viewBox="0 0 280 60" width="100%" style="margin-top:12px"><polyline points="${pts}" fill="none" stroke="#ffd21f" stroke-width="3"/></svg>`:""}<ul>${ws.slice().reverse().slice(0,4).map(x=>`<li>${fmt(x.d,{day:"2-digit",month:"short"})} — <b>${x.kg} kg</b></li>`).join("")||"<li>Registre seu peso para acompanhar.</li>"}</ul></div>
<h2>Cargas</h2><div class="card"><ul>${Object.entries(ld).map(([n,a])=>`<li class="row"><span>${n}</span><b style="color:var(--tx)">${a[a.length-1]} kg ${a.length>1?(a[a.length-1]>=a[0]?"▲ +":"▼ ")+(a[a.length-1]-a[0]).toFixed(1).replace(".0",""):""}</b></li>`).join("")||"<li>Anote os kg em cada exercício e veja a progressão aqui.</li>"}</ul></div>`}
function hist(){const f=fins().reverse();return `<h1>Histórico</h1><p class="sub" style="margin-bottom:12px;text-transform:none">${f.length} treinos concluídos</p>`+(f.map(d=>{const w=W[keyFor(d)],n=Object.values(S.log[d].ex||{}).filter(x=>x.d).length;return `<div class="card row"><div><b>${w.n}</b><div class="sub" style="margin:0;font-size:14px">${fmt(d,{weekday:"short",day:"numeric",month:"short"})} · ${n}/${w.e.length} exercícios</div></div><button class="sm" data-a="del" data-v="${d}">Apagar</button></div>`}).join("")||`<div class="card">Nenhum treino concluído ainda. Bora começar!</div>`)}
function render(){nav();$("#v").innerHTML={home,treinos,cal,evo,hist}[tab]()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.tagName=="INPUT")return;const a=b.dataset.a,v=b.dataset.v,i=b.dataset.i,d=today(),l=lg(d);l.ex=l.ex||{};
if(a=="tab"){tab=v;scrollTo(0,0)}
else if(a=="tog"){const x=l.ex[i]=l.ex[i]||{};x.d=!x.d;if(!x.d)l.fin=false;if(navigator.vibrate)navigator.vibrate(20)}
else if(a=="fin"){const k=keyFor(d);W[k].e.forEach((_,j)=>{(l.ex[j]=l.ex[j]||{}).d=true});l.fin=true;l.w=k}
else if(a=="unfin")l.fin=false;
else if(a=="pick"){if(!l.fin)l.w=v;tab="home";scrollTo(0,0)}
else if(a=="mm")cm.setMonth(cm.getMonth()+ +v);
else if(a=="wt"){const kg=parseFloat($("#wt").value.replace(",","."));if(kg>0){S.w=S.w.filter(x=>x.d!=d);S.w.push({d,kg})}}
else if(a=="del"&&confirm("Apagar este treino do histórico?"))delete S.log[v];
save();render()});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.a=="kg"){const l=lg(today());l.ex=l.ex||{};(l.ex[t.dataset.i]=l.ex[t.dataset.i]||{}).kg=t.value;save()}});
render();
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
